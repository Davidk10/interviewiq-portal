# XcodeGen spec — run `xcodegen generate` in this folder to create InterviewIQ.xcodeproj.
# The .xcodeproj is generated, not committed, so this file is the source of truth.
name: InterviewIQ
options:
  bundleIdPrefix: com.kestechgroup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (Xcode → Signing & Capabilities also works).
    DEVELOPMENT_TEAM: ""

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"

targets:
  InterviewIQ:
    type: application
    platform: iOS
    sources:
      - path: InterviewIQ
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kestechgroup.interviewiq
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: InterviewIQ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  InterviewIQTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InterviewIQTests
    dependencies:
      - target: InterviewIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kestechgroup.interviewiqTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  InterviewIQ:
    build:
      targets:
        InterviewIQ: all
        InterviewIQTests: [test]
    test:
      targets:
        - InterviewIQTests
